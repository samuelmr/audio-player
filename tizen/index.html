<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <title>Ctrl&ndash; music player</title>
  <style>
<%= htmlWebpackPlugin.options.styles %>
  </style>
  <style>
    /* The TV app is dark, like the room it's watched in, whatever the TV's
       color scheme: these are the dark colors of styles.css, which has them
       only for devices set to dark. Behind everything is the album art of
       the playing track, blurred (tizen-player.js). The text is large, for
       reading from the sofa. */
    :root {
        --base-lightness: 25%;
        --bg: hsl(var(--base-hue), 40%, 7%);
        --bg-glow: hsl(var(--base-hue), 45%, 20%);
        --text: hsl(var(--base-hue), 30%, 96%);
        --accent: hsl(var(--base-hue), 80%, 70%);
        --accent-soft: hsla(var(--base-hue), 80%, 70%, 0.16);
        --on-accent: hsl(var(--base-hue), 60%, 8%);
        --glass: hsla(var(--base-hue), 40%, 80%, 0.1);
        --panel: hsl(var(--base-hue), 35%, 12%);
        --line: hsla(var(--base-hue), 40%, 80%, 0.2);
        --shadow: hsla(0, 0%, 0%, 0.5);
        --error: hsl(0, 85%, 72%);
        --gutter: 3em;
        /* the remote moves the focus, so it must stand out: the accent,
           with dark text, and a glow */
        --focus-background: var(--accent);
        --focus-outline: var(--accent);
        --focus-text: var(--on-accent);
        --glow: 0 0.4em 1.2em hsla(0, 0%, 0%, 0.45), 0 0 1.2em hsla(var(--base-hue), 80%, 70%, 0.35);
    }
    body {
        background-image: none;
        font-size: 1.5em;
        min-height: 100vh;
    }
    #backdrop {
        background-position: center;
        background-size: cover;
        bottom: -10%;
        filter: blur(60px) brightness(30%) saturate(130%);
        left: -10%;
        position: fixed;
        right: -10%;
        top: -10%;
        z-index: -1;
    }
    #backdrop.no-art {
        background: radial-gradient(circle at 20% 0, hsl(var(--base-hue), 45%, 22%), hsl(var(--base-hue), 40%, 6%) 70%);
        filter: none;
    }

    /* Focus: the accent fills rows and buttons, and rings the rest */
    :focus {
        outline: 0.15em solid var(--focus-outline) !important;
        outline-offset: 0.15em;
    }
    a:focus, li.folder:focus, li.playlist:focus, li.song:focus, .collection li:focus, audio-track:focus, .queue-summary:focus,
    audio-browser nav#skipNav ul.search-results li:focus, audio-player .now:focus,
    button:focus, input[type=submit]:focus, input[type=reset]:focus, #buttons button:focus {
        background-color: var(--focus-background) !important;
        box-shadow: var(--glow);
        color: var(--focus-text) !important;
        outline: none !important;
    }
    a.action:focus svg, .collection a:focus svg, #buttons button:focus svg path {
        fill: var(--focus-text);
    }
    .collection a:focus {
        opacity: 1;
    }
    audio-track.playing:focus .track a {
        color: inherit;
    }

    /* the whole width of the screen */
    audio-player, audio-browser {
        max-width: none;
    }
    /* the queue's sources and Save offline are in the open queue, past
       the summary that Right opens it from */
    audio-player {
        grid-column-gap: 2.5em;
        grid-template-areas:
            "now buttons time gear"
            "progress progress progress progress"
            "summary summary summary summary"
            "sources offline offline offline"
            "queue queue queue queue";
        grid-template-columns: 1fr auto auto auto;
        padding-top: 1.25em;
    }
    audio-player:not(.queue-open) button.save-offline {
        display: none;
    }
    audio-player button.save-offline {
        align-self: start;
    }
    .toast {
        box-shadow: var(--glow);
    }
    audio-player #buttons button:focus {
        transform: scale(1.12);
    }
    audio-player button.gear:focus {
        opacity: 1;
    }
    /* the knob of the progress bar shows when it has the focus, and Left
       and Right seek */
    audio-player #progress::-webkit-slider-thumb {
        transform: scale(0);
    }
    audio-player #progress:focus {
        outline: none !important;
    }
    audio-player #progress:focus::-webkit-slider-thumb {
        box-shadow: 0 0 0 0.35em hsla(var(--base-hue), 80%, 70%, 0.35);
        transform: scale(1.2);
    }

    /* Now Playing keeps the sizes it had before the larger text */
    #now-playing {
        font-size: 16px;
    }

    /* The library: OK adds the focused item, so the add buttons aren't
       needed, nor room for them */
    audio-browser a.action.add {
        display: none !important;
    }
    audio-browser li.folder, audio-browser li.playlist, audio-browser li.song,
    audio-browser nav#skipNav ul.search-results li {
        padding-right: 1em;
    }
    audio-browser li.open > ol {
        margin-right: -1em;
    }
    audio-browser nav#skipNav {
        grid-template-columns: 1fr 20em;
    }
    audio-browser nav#skipNav a:focus {
        transform: scale(1.25);
    }
    /* the focus color of an open folder would go to its contents too */
    audio-browser li li {
        color: var(--text);
    }

    /* Two columns: folders on the left, and the songs of the selected
       folder or playlist on the right, level with it (tizen-library.js) */
    audio-browser nav:not(#skipNav) {
        font-size: 1.15em;
    }
    audio-browser nav:not(#skipNav) > ol {
        width: 50%;
    }

    /* the folder whose songs are shown is marked with a band of the accent
       as tall as its row; when it has the focus, the band is the focus
       color, as the focus would fill the folder's contents too */
    audio-browser li.open.selected, audio-browser li.folder.open:focus, audio-browser li.playlist.open:focus {
        background-image: linear-gradient(var(--accent-soft), var(--accent-soft));
        background-position: top;
        background-repeat: no-repeat;
        background-size: 100% 2.3em;
    }
    li.folder.open:focus, li.playlist.open:focus {
        background-color: transparent !important;
        background-image: linear-gradient(var(--focus-background), var(--focus-background)) !important;
        box-shadow: none;
    }

    /* the songs on a panel, level with their folder; left and width
       come from tizen-library.js. important: styles.css shows the lists of
       open folders */
    audio-browser li.folder > ol.songs, audio-browser li.playlist > ol.songs {
        display: none !important;
    }
    audio-browser li.open.selected > ol.songs {
        background-color: var(--panel);
        border: 0;
        border-radius: 0.75em;
        box-shadow: 0 1.5em 3em var(--shadow);
        display: block !important;
        margin: 0 0 0 1em;
        padding: 0.5em;
        position: absolute;
        top: 0;
        z-index: 1;
    }
    audio-browser ol.songs li.song {
        padding: 0.4em 0.75em;
    }

    dialog#settings {
        font-size: 0.8em;
    }
    dialog#exit-confirm .buttons {
        justify-content: center;
    }
  </style>
 </head>
 <body>
  <audio-player id="ap" name="Player" track="" next="" previous="">
  </audio-player>
  <audio-browser>
    Loading...
  </audio-browser>
 </body>
</html>
