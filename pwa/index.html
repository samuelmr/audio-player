<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="width">
  <meta name="theme-color" content="hsl(180, 50%, 75%)" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="hsl(180, 50%, 25%)" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="play-192.png"/>
  <script>
    const keys = [
     'accessKeyId',
     'secretAccessKey',
     'endpoint',
     'region',
     'bucketName'
    ]
    const params = new URLSearchParams(document.location.search)
    const a = document.createElement('a')
    a.href = document.location.href
    let keysFound = false
    keys.forEach(key => {
      if (params.get(key)) {
        keysFound = true
        localStorage.setItem(key, params.get(key))
        a.search = a.search.replace(new RegExp(`${key}=[^&]*&?`), '')
      }
    })
    if (keysFound) {
      // redirect to hide secret params
      document.location.href = a.href
    }
   </script>
   <title>Ctrl&ndash; music player</title>
   <link rel="manifest" href="./manifest.json">
   <link rel="apple-touch-icon" href="play-192.png">
  <style>
<%= htmlWebpackPlugin.options.styles %>
  </style>
  <style>
    /* The web app is used by clicking and tapping: rows and buttons light
       up under the mouse, the keyboard's focus is a ring, touch gets larger
       targets, and phones stack the player and give the tracks two lines.
       Only for browsers, so newer CSS than the TV's is fine here. */
    :root {
        /* the height of a row in the library */
        --row: 2.3em;
    }
    :focus:not(:focus-visible) {
        outline: none;
    }
    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    /* a click anywhere on a queued track plays it, as on its title; over
       the faded parts, as opacity paints them in a layer of their own */
    audio-track {
        cursor: pointer;
    }
    audio-track .track a:after {
        content: "";
        inset: 0;
        position: absolute;
        z-index: 1;
    }

    /* A click on a track or playlist in the library adds it to the queue:
       the add link covers the row, and the + shows at its end under the
       mouse. A click on a folder opens and closes it, and the first row of
       an open folder adds all of it. */
    audio-browser a.action.add {
        align-items: center;
        border-radius: 0.5em;
        bottom: 0;
        display: flex;
        height: auto;
        justify-content: flex-end;
        left: 0;
        opacity: 1;
        padding: 0 0.6em;
        right: 0;
        top: 0;
        width: auto;
    }
    audio-browser a.action.add svg {
        height: 1.3em;
        opacity: 0;
        width: 1.3em;
    }
    audio-browser li.folder, audio-browser li.playlist, audio-browser li.song,
    audio-browser nav#skipNav ul.search-results li {
        padding-right: 2.5em;
    }
    audio-browser li.folder {
        cursor: pointer;
    }
    audio-browser li.open > ol {
        margin-right: -2.5em;
    }
    audio-browser li.folder > a.action.add {
        display: none;
    }
    /* Add all, on the guide line of the contents, before them */
    audio-browser li.folder.open > a.action.add {
        border-left: 2px solid var(--line);
        border-radius: 0 0.5em 0.5em 0;
        color: var(--accent);
        display: flex;
        font-weight: 600;
        height: auto;
        justify-content: flex-start;
        line-height: 1.4em;
        margin: 0.45em -2.5em 0 0;
        padding: 0.45em 1em;
        position: static;
        width: auto;
    }
    audio-browser li.folder.open > a.action.add svg {
        height: 1.2em;
        margin-right: 0.5em;
        opacity: 1;
        width: 1.2em;
    }
    audio-browser li.folder.open > a.action.add + ol {
        margin-top: 0;
    }
    audio-browser li.folder > a.action.add .label {
        display: none;
    }
    audio-browser li.folder.open > a.action.add .label {
        display: inline;
    }
    /* the remove button of an offline playlist stays beside it */
    audio-browser #offline-playlists a.action.add {
        right: 2.6em;
    }
    audio-browser #offline-playlists a.action.remove {
        z-index: 1;
    }

    @media (hover: hover) {
        audio-player #buttons button:not(:disabled):hover {
            transform: scale(1.08);
        }
        audio-player button.gear:hover, audio-player button.np-open:hover, audio-player ol.collection a:hover,
        audio-browser a.action.remove:hover {
            opacity: 1;
        }
        audio-player button.save-offline:hover, .queue-summary:hover, audio-player ol.collection li:hover,
        audio-track:not(.playing):hover, audio-browser nav#skipNav ol a:hover,
        audio-browser a.action.add:hover, audio-browser nav#skipNav ul.search-results li:hover {
            background-color: var(--line);
        }
        audio-browser a.action.add:hover svg {
            opacity: 0.6;
        }
        #now-playing .np-controls button:not(.np-play):hover, #now-playing .np-close:hover {
            background-color: hsla(0, 0%, 50%, 0.25);
        }
        /* a folder's own row, not its contents */
        audio-browser li.folder:hover:not(:has(> a:hover)):not(:has(li:hover)) {
            background-image: linear-gradient(var(--line), var(--line));
            background-repeat: no-repeat;
            background-size: 100% var(--row);
        }
        audio-player .now-art:hover {
            transform: scale(1.04);
        }
    }

    /* opens Now Playing, at the top right: when something plays */
    audio-player button.np-open {
        background: none;
        border: 0;
        border-radius: 50%;
        color: var(--text);
        height: 2.8em;
        margin-left: -1em;
        opacity: 0.75;
        padding: 0;
        width: 2.8em;
    }
    audio-player button.np-open svg {
        display: block;
        height: 1.4em;
        margin: auto;
        width: 1.4em;
    }
    audio-player.idle button.np-open {
        visibility: hidden;
    }
    audio-player .now-art {
        cursor: pointer;
        transition: transform 120ms;
    }
    audio-player.idle .now-art {
        cursor: default;
    }

    /* the progress bar in Firefox, which has its own parts */
    audio-player #progress::-moz-range-track {
        background-color: var(--line);
        border-radius: 0.15em;
        height: 0.3em;
    }
    audio-player #progress::-moz-range-progress {
        background-color: var(--accent);
        border-radius: 0.15em;
        height: 0.3em;
    }
    audio-player #progress::-moz-range-thumb {
        background-color: var(--accent);
        border: 0;
        height: 1em;
        width: 1em;
    }
    audio-player.idle #progress::-moz-range-thumb {
        visibility: hidden;
    }

    /* fingers need larger targets than the mouse */
    @media (pointer: coarse) {
        :root {
            --row: 2.9em;
        }
        audio-player #progress {
            height: 2.75em;
            margin: 0;
        }
        audio-player #progress::-webkit-slider-thumb {
            height: 1.3em;
            margin-top: -0.5em;
            width: 1.3em;
        }
        audio-browser li.folder, audio-browser li.playlist, audio-browser li.song {
            padding-bottom: 0.75em;
            padding-top: 0.75em;
        }
        audio-browser li.folder.open > a.action.add {
            padding-bottom: 0.75em;
            padding-top: 0.75em;
        }
        audio-browser a.action.remove {
            top: 0.45em;
        }
        audio-player ol.collection a {
            padding: 0.4em;
        }
    }

    /* phones: the art and title, the progress bar with the time under it,
       and the buttons in a row of their own; Save offline is an icon */
    @media (max-width: 40em) {
        :root {
            --gutter: 1em;
        }
        audio-player {
            grid-column-gap: 0.5em;
            grid-template-areas:
                "now gear expand"
                "progress progress progress"
                "time time time"
                "buttons buttons buttons"
                "summary summary offline"
                "sources sources sources"
                "queue queue queue";
            grid-template-columns: 1fr auto auto;
        }
        audio-player .now-art {
            height: 3.75em;
            margin-right: 1em;
            width: 3.75em;
        }
        audio-player .now-title {
            font-size: 1.35em;
        }
        audio-player .now-subtitle {
            font-size: 1em;
        }
        audio-player button.gear, audio-player button.np-open {
            align-self: start;
            margin: 0.3em 0 0 0;
        }
        audio-player .audio-time {
            font-size: 0.9em;
            justify-self: end;
            margin-top: -0.6em;
        }
        audio-player #buttons {
            justify-self: center;
            margin-bottom: 0.75em;
        }
        audio-player #buttons button {
            height: 3em;
            margin: 0 0.6em;
            width: 3em;
        }
        audio-player #buttons button:nth-child(2) {
            height: 4em;
            width: 4em;
        }
        audio-player button.save-offline {
            border-radius: 50%;
            font-size: 0;
            margin: 0;
            padding: 0.6rem;
        }
        audio-player button.save-offline svg {
            display: block;
            height: 1.4rem;
            width: 1.4rem;
        }
        audio-player ol.collection {
            margin-bottom: 0;
        }
        .queue-summary .next {
            display: block;
            margin: 0.2em 0 0 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* two lines: the title, and the artist under it */
        audio-track {
            align-content: center;
            grid-template-areas: "track duration" "artist duration";
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto;
            height: 3.6em;
        }
        audio-track section.album {
            display: none;
        }
        audio-track .artist {
            font-size: 0.9em;
        }
        /* the shortcuts scroll sideways, over the search */
        audio-browser nav#skipNav {
            grid-row-gap: 0.5em;
            grid-template-columns: 1fr;
        }
        audio-browser nav#skipNav ol {
            flex-wrap: nowrap;
            margin-bottom: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        audio-browser nav#skipNav ol li {
            flex: none;
            margin-bottom: 0;
        }
    }

    /* Now Playing on a screen taller than wide: the art above the details */
    @media (max-aspect-ratio: 1/1) {
        #now-playing {
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
            padding: 4.5em 1.5em 2em 1.5em;
        }
        #now-playing .cover {
            height: min(80vw, 40vh);
            margin: 0 0 1.5em 0;
            width: min(80vw, 40vh);
        }
        #now-playing .details {
            flex: none;
            max-width: 32em;
            width: 100%;
        }
        #now-playing .np-title, #now-playing.no-art .np-title {
            font-size: 2em;
        }
        #now-playing .np-artist {
            font-size: 1.35em;
        }
        #now-playing .np-album, #now-playing .np-meta {
            font-size: 1.05em;
        }
        #now-playing .progress {
            margin-top: 1.25em;
        }
        #now-playing .time {
            font-size: 1em;
        }
        #now-playing .np-controls {
            justify-content: center;
            margin: 0 0 1.5em 0;
        }
        #now-playing .up-next-title {
            font-size: 0.9em;
        }
        #now-playing .up-next {
            font-size: 1.05em;
        }
        #now-playing .np-close {
            right: 1em;
            top: 1em;
        }
    }
  </style>
 </head>
 <body>
  <audio-player id="ap" name="Player" track="" next="" previous="">
  </audio-player>
  <audio-browser>
    Loading...
  </audio-browser>
 </body>
</html>
