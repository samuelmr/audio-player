# Builds the web app, runs the tests, and publishes dist/pwa on GitHub Pages
# through the gh-pages branch: main at the root of the site, every other
# branch in a folder named after it (slashes become dashes), such as
# /my-test-branch/. Deleting a branch removes its folder.
name: Deploy the web app to GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    # a newer push to the same branch replaces a build still waiting
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # package-lock.json isn't committed, so this gets the latest dependencies
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: pwa
          path: dist/pwa

  publish:
    needs: build
    # after a successful build, or without one when a branch was deleted
    if: >-
      !cancelled() && (needs.build.result == 'success' ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch'))
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name != 'delete'
        uses: actions/download-artifact@v8
        with:
          name: pwa
          path: pwa
      - uses: actions/checkout@v7
        with:
          path: site
      - name: Commit to gh-pages
        working-directory: site
        env:
          # the deleted branch, or the one that was pushed
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
          DELETED: ${{ github.event_name == 'delete' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin gh-pages; then
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
            git rm -rqf --ignore-unmatch .
          fi

          dir="${BRANCH//\//-}"
          if [ "$DELETED" = true ]; then
            rm -rf "$dir"
            message="Remove $BRANCH"
          elif [ "$BRANCH" = main ]; then
            # only the files of main are replaced, the branch folders stay
            find . -maxdepth 1 -type f ! -name CNAME ! -name .nojekyll -delete
            cp -R ../pwa/. .
            message="Deploy main at $GITHUB_SHA"
          else
            rm -rf "$dir"
            mkdir "$dir"
            cp -R ../pwa/. "$dir/"
            message="Deploy $BRANCH at $GITHUB_SHA"
          fi

          # the custom domain set in the Pages settings, if any
          cname=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // empty' 2>/dev/null || true)
          if [ -n "$cname" ]; then echo "$cname" > CNAME; fi
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -qm "$message"
          # another branch may have been published meanwhile; they touch different folders
          for attempt in 1 2 3 4 5; do
            if git push -q origin gh-pages; then exit 0; fi
            sleep $((attempt * 3))
            git pull -q --rebase origin gh-pages
          done
          exit 1
