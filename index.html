/* The look of both apps: rows and rounded panels of glass on a background
   tinted by the player's hue, which comes from the album art. Light or
   dark by the device's setting; the TV app is always dark. The interaction
   states are each app's own: hover and the keyboard on the web
   (pwa/index.html), the remote on the TV (tizen/index.html).
   The TV loads this too, so nothing here may need more than Chromium 76:
   no gap in flexbox, no inset, min(), max() or clamp(). */
:root {
    --base-hue: 180;
    /* for the slider of the color setting (settings.js) */
    --base-saturation: 45%;
    --base-lightness: 75%;
    --bg: hsl(var(--base-hue), 35%, 95%);
    --bg-glow: hsl(var(--base-hue), 55%, 84%);
    --text: hsl(var(--base-hue), 40%, 10%);
    --text-color: var(--text);
    --accent: hsl(var(--base-hue), 65%, 38%);
    --accent-soft: hsla(var(--base-hue), 65%, 38%, 0.12);
    --on-accent: hsl(var(--base-hue), 60%, 98%);
    --glass: hsla(var(--base-hue), 40%, 30%, 0.08);
    --panel: hsl(var(--base-hue), 40%, 99%);
    --line: hsla(var(--base-hue), 40%, 30%, 0.2);
    --shadow: hsla(var(--base-hue), 40%, 10%, 0.2);
    --error: hsl(0, 70%, 42%);
    /* the space at the sides */
    --gutter: 1.5em;
}
@media (prefers-color-scheme: dark) {
    :root {
        --base-lightness: 25%;
        --bg: hsl(var(--base-hue), 40%, 7%);
        --bg-glow: hsl(var(--base-hue), 45%, 20%);
        --text: hsl(var(--base-hue), 30%, 96%);
        --accent: hsl(var(--base-hue), 80%, 70%);
        --accent-soft: hsla(var(--base-hue), 80%, 70%, 0.16);
        --on-accent: hsl(var(--base-hue), 60%, 8%);
        --glass: hsla(var(--base-hue), 40%, 80%, 0.1);
        --panel: hsl(var(--base-hue), 35%, 12%);
        --line: hsla(var(--base-hue), 40%, 80%, 0.2);
        --shadow: hsla(0, 0%, 0%, 0.5);
        --error: hsl(0, 85%, 72%);
    }
}
* {
    box-sizing: border-box;
    margin-block-start: 0;
    margin-block-end: 0;
    margin-inline-start: 0;
    margin-inline-end: 0;
    padding-inline-start: 0;
}
/* a glow of the hue at the top */
body {
    background-color: var(--bg);
    background-image: radial-gradient(60em 30em at 20% 0, var(--bg-glow), hsla(0, 0%, 0%, 0));
    background-repeat: no-repeat;
    color: var(--text);
    font-family: 'Source Sans Pro', sans-serif;
    margin: 0;
}
a {
    color: inherit;
    text-decoration: none;
}
button {
    cursor: pointer;
    font-family: inherit;
}
audio-player, audio-browser {
    display: block;
    margin: 0 auto;
    max-width: 64em;
    padding: 0 var(--gutter);
}

/* The player: a small Now Playing (player-bar.js), the buttons, the time
   and the settings in a row, and a thin progress bar under them. The queue
   below starts with its summary row (queue.js); expanded, its sources and
   Save offline come before the tracks. A grid, as Chromium 76 has no gap
   in flexbox. */
audio-player {
    align-items: center;
    display: grid;
    grid-column-gap: 2em;
    grid-template-areas:
        "now buttons time gear expand"
        "progress progress progress progress progress"
        "summary offline offline offline offline"
        "sources sources sources sources sources"
        "queue queue queue queue queue";
    grid-template-columns: 1fr auto auto auto auto;
    padding-top: 1em;
}
/* so that long titles end in an ellipsis instead of widening the grid */
audio-player > * {
    min-width: 0;
}
audio-player .now { grid-area: now; }
audio-player #buttons { grid-area: buttons; }
audio-player .audio-time { grid-area: time; }
audio-player button.gear { grid-area: gear; }
audio-player button.np-open { grid-area: expand; }
audio-player #progress { grid-area: progress; }
audio-player .queue-summary { grid-area: summary; }
audio-player ol.collection { grid-area: sources; }
audio-player button.save-offline { grid-area: offline; }
audio-player > nav { grid-area: queue; }
/* the title is in the small Now Playing */
audio-player div.track {
    display: none;
}

audio-player .now {
    align-items: center;
    border-radius: 1em;
    display: flex;
    margin-left: -0.5em;
    padding: 0.5em;
}
/* without art, a gradient of the hue */
audio-player .now-art {
    background: radial-gradient(circle at 30% 30%, hsl(var(--base-hue), 50%, 55%), hsl(var(--base-hue), 45%, 25%));
    border-radius: 0.6em;
    box-shadow: 0 0.75em 1.5em var(--shadow);
    flex: none;
    height: 5em;
    margin-right: 1.25em;
    overflow: hidden;
    width: 5em;
}
audio-player .now-art img {
    display: block;
    height: 100%;
    object-fit: cover;
    width: 100%;
}
audio-player .now.no-art img {
    display: none;
}
audio-player .now-text {
    min-width: 0;
}
audio-player .now-title, audio-player .now-subtitle {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
audio-player .now-title {
    font-size: 1.75em;
    font-weight: 700;
    line-height: 1.2;
}
audio-player .now-subtitle {
    font-size: 1.1em;
    margin-top: 0.15em;
    opacity: 0.7;
}
audio-player .now.idle .now-title {
    font-weight: 600;
    opacity: 0.85;
}
audio-player .now.idle .now-art {
    opacity: 0.5;
}
audio-player .now.idle .now-subtitle {
    white-space: normal;
}

/* round buttons, the play button the largest and filled */
audio-player #buttons {
    align-items: center;
    display: flex;
    white-space: nowrap;
}
audio-player #buttons button {
    background: none;
    border: 0;
    border-radius: 50%;
    font-size: 1em;
    height: 3.25em;
    margin: 0 0.3em;
    padding: 0;
    transition: transform 120ms;
    width: 3.25em;
}
audio-player #buttons button svg {
    display: block;
    height: 1.6em;
    margin: auto;
    width: 1.6em;
}
audio-player #buttons button svg path {
    fill: var(--text);
}
audio-player #buttons button:nth-child(2) {
    background-color: var(--text);
    height: 4.5em;
    width: 4.5em;
}
audio-player #buttons button:nth-child(2) svg {
    height: 2em;
    width: 2em;
}
audio-player #buttons button:nth-child(2) svg path {
    fill: var(--bg);
}
audio-player #buttons button:disabled {
    cursor: default;
    opacity: 0.4;
}
audio-player #buttons button.stalled {
    animation: 0.8s infinite alternate pulse;
}
@keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.2; }
}

/* the time, which can be typed into while paused */
audio-player .audio-time {
    font-size: 1.1em;
    opacity: 0.75;
    white-space: nowrap;
}
audio-player .audio-time input {
    background: none;
    border: 0;
    border-bottom: 1px solid transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 1em;
    font-variant-numeric: tabular-nums;
    padding: 0;
    text-align: center;
    width: 2.6em;
}
audio-player .audio-time input#cursor:enabled {
    border-bottom-color: var(--line);
}

audio-player button.gear {
    background: none;
    border: 0;
    border-radius: 50%;
    color: var(--text);
    font-size: 1.75em;
    height: 1.6em;
    line-height: 1;
    opacity: 0.75;
    padding: 0;
    width: 1.6em;
}

/* the played part fills with the accent (--played, from player-bar.js) */
audio-player #progress {
    -webkit-appearance: none;
    background: none;
    cursor: pointer;
    height: 1.2em;
    margin: 1em 0 0.75em 0;
    width: 100%;
}
audio-player #progress::-webkit-slider-runnable-track {
    background: linear-gradient(to right, var(--accent) var(--played, 0%), var(--line) var(--played, 0%));
    border-radius: 0.15em;
    height: 0.3em;
}
audio-player #progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    background-color: var(--accent);
    border: 0;
    border-radius: 50%;
    height: 1em;
    margin-top: -0.35em;
    transition: transform 120ms;
    width: 1em;
}

audio-player.idle #progress::-webkit-slider-thumb {
    visibility: hidden;
}

/* The queue's summary: the count, labeled like Up Next in Now Playing,
   and the next track */
.queue-summary {
    background: none;
    border: 0;
    border-radius: 0.6em;
    color: inherit;
    font-size: 1em;
    margin: 0 -0.5em 0.5em -0.5em;
    overflow: hidden;
    padding: 0.6em 1em 0.6em 2.25em;
    position: relative;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.queue-summary:before {
    content: "›";
    font-size: 1.4em;
    left: 0.6em;
    line-height: 1;
    position: absolute;
    top: 0.3em;
    transition: transform 120ms;
}
.queue-summary.open:before {
    transform: rotate(90deg);
}
.queue-summary[hidden] {
    display: none;
}
.queue-summary .count {
    font-size: 0.85em;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0.75;
    text-transform: uppercase;
}
.queue-summary .next {
    margin-left: 1.5em;
    opacity: 0.9;
}
.queue-summary .next:empty {
    display: none;
}
audio-player:not(.queue-open) ol.collection, audio-player nav.collapsed {
    display: none;
}

/* where the tracks came from, as chips with a remove button */
audio-player ol.collection {
    display: flex;
    flex-wrap: wrap;
    list-style: none;
    margin: 0 0 0.5em 0;
    padding: 0;
}
audio-player ol.collection li {
    align-items: center;
    background-color: var(--glass);
    border-radius: 2em;
    cursor: pointer;
    display: flex;
    margin: 0 0.6em 0.6em 0;
    padding: 0.3em 0.4em 0.3em 1em;
}
audio-player ol.collection a {
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
    margin-left: 0.4em;
    opacity: 0.6;
    padding: 0.15em;
}
audio-player ol.collection svg {
    display: block;
    fill: currentColor;
    height: 1.1em;
    width: 1.1em;
}
/* across the columns of the controls, so as not to widen them */
audio-player button.save-offline {
    align-self: center;
    background-color: var(--glass);
    border: 0;
    border-radius: 2em;
    color: var(--text);
    font-size: 1em;
    justify-self: end;
    margin: 0 0 0.5em 0;
    padding: 0.4em 1.1em;
    white-space: nowrap;
}
audio-player button.save-offline svg {
    fill: currentColor;
    height: 1.2em;
    vertical-align: -0.25em;
}
audio-player button.save-offline[hidden] {
    display: none;
}

/* the queued tracks as rows: art, title, artist, album and length */
audio-player > nav {
    margin: 0 -0.5em 0.5em -0.5em;
    max-height: 40vh;
    overflow: auto;
    padding: 0 0.5em;
}
audio-track {
    align-items: center;
    background-position: 0.55em center;
    background-repeat: no-repeat;
    background-size: 2.3em 2.3em;
    border-radius: 0.6em;
    display: grid;
    grid-template-areas: "track artist album duration";
    grid-template-columns: 2fr 1.3fr 1.3fr 4em;
    grid-template-rows: 3.2em;
    height: 3.2em;
    margin: 0.2em 0;
    overflow: hidden;
    padding: 0 1em 0 3.75em;
    position: relative;
}
/* without art, an empty square in its place */
audio-track:not([data-album-art]):before {
    background-color: var(--glass);
    border-radius: 0.35em;
    content: "";
    height: 2.3em;
    left: 0.55em;
    position: absolute;
    top: 0.45em;
    width: 2.3em;
}
audio-track section {
    display: none;
    overflow: hidden;
    padding: 0 0.75em 0 0;
    text-overflow: ellipsis;
    white-space: nowrap;
}
audio-track section.track, audio-track section.artist, audio-track section.album, audio-track section.duration {
    display: block;
}
audio-track .track {
    font-weight: 700;
    grid-area: track;
}
audio-track .artist {
    grid-area: artist;
    opacity: 0.8;
}
audio-track .album, audio-track .duration {
    font-size: 0.9em;
    opacity: 0.65;
}
audio-track .album {
    grid-area: album;
}
audio-track .duration {
    grid-area: duration;
    padding-right: 0;
    text-align: right;
}
audio-track.playing {
    background-color: var(--accent-soft);
    box-shadow: inset 0.25em 0 0 var(--accent);
}
audio-track.playing .track a {
    color: var(--accent);
}
audio-track .offline-icon {
    display: none;
    margin-right: 0.25em;
}
audio-track .offline-icon svg {
    fill: currentColor;
    height: 1em;
    vertical-align: -0.15em;
}
audio-track.offline-saved .offline-icon, audio-track.offline-downloading .offline-icon, audio-track.offline-failed .offline-icon {
    display: inline;
}
audio-track.offline-downloading .offline-icon {
    animation: 0.8s infinite alternate pulse;
}
audio-track.offline-failed .offline-icon {
    color: var(--error);
}
@media (prefers-reduced-motion: reduce) {
    audio-track.offline-downloading .offline-icon, audio-player #buttons button.stalled {
        animation: none;
        opacity: 0.5;
    }
}

/* The library */
audio-browser {
    padding-bottom: 3em;
}
audio-browser ol, audio-browser ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

/* the shortcuts as round keys, and the search beside them, in a band
   that stays at the top */
audio-browser nav#skipNav {
    align-items: center;
    background-color: var(--bg);
    box-shadow: 0 0.5em 1em -0.5em var(--shadow);
    display: grid;
    grid-column-gap: 2em;
    grid-template-columns: 1fr 18em;
    margin: 0 calc(-1 * var(--gutter));
    padding: 0.6em var(--gutter);
    position: sticky;
    top: 0;
    z-index: 2;
}
audio-browser nav#skipNav > * {
    min-width: 0;
}
/* as many rows as the letters need, beside the search */
audio-browser nav#skipNav ol {
    display: flex;
    flex-wrap: wrap;
    margin-bottom: -0.4em;
}
audio-browser nav#skipNav ol li {
    margin-bottom: 0.4em;
}
audio-browser nav#skipNav ol a {
    background-color: var(--glass);
    border-radius: 50%;
    display: block;
    font-weight: 700;
    height: 2em;
    line-height: 2em;
    margin-right: 0.4em;
    text-align: center;
    transition: transform 120ms;
    width: 2em;
}
audio-browser nav#skipNav ol a svg {
    fill: currentColor;
    height: 0.8em;
    vertical-align: -0.05em;
}
audio-browser nav#skipNav input[type=search] {
    background-color: var(--glass);
    border: 0;
    border-radius: 2em;
    color: var(--text);
    font-family: inherit;
    font-size: 1em;
    padding: 0.4em 1.1em;
    width: 100%;
}
audio-browser nav#skipNav input[type=search]::placeholder {
    color: var(--text);
    opacity: 0.55;
}
audio-browser nav#skipNav ul.search-results {
    margin-top: 0.5em;
    max-height: 50vh;
    overflow-y: auto;
}
audio-browser nav#skipNav ul.search-results:empty {
    display: none;
}
audio-browser nav#skipNav ul.search-results li {
    background-color: var(--glass);
    border-radius: 0.5em;
    margin: 0.25em 0;
    padding: 0.4em 3em 0.4em 1em;
    position: relative;
}
audio-browser nav#skipNav ul.search-results li.result-folder .name, audio-browser nav#skipNav ul.search-results li.result-playlist .name {
    font-weight: 700;
}
audio-browser nav#skipNav ul.search-results li.empty {
    font-style: italic;
}
audio-browser nav#skipNav ul.search-results small {
    opacity: 0.75;
}

/* Folders as rows without boxes, a chevron before the name and the
   contents of an open folder indented along a guide line. A row is 2.3em
   high; the add button is at its end. */
audio-browser nav:not(#skipNav) {
    padding-top: 0.75em;
}
audio-browser li.folder, audio-browser li.playlist, audio-browser li.song {
    border-radius: 0.5em;
    line-height: 1.4em;
    margin: 0;
    padding: 0.45em 3em 0.45em 2em;
    position: relative;
}
audio-browser li.playlist, audio-browser li.song {
    padding-left: 1em;
}
audio-browser li.folder:before {
    content: "›";
    font-size: 1.3em;
    left: 0.45em;
    line-height: 1.1;
    opacity: 0.6;
    position: absolute;
    top: 0.3em;
    transition: transform 120ms;
}
audio-browser li.folder.open:before {
    transform: rotate(90deg);
}
audio-browser li > ol {
    display: none;
}
/* to the folder's right edge, past the room of its add button, so that
   the add buttons of every level line up */
audio-browser li.open > ol {
